name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # the project targets the current Python and requires it
                python-version: ["3.14"]
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install (CPU-only torch, to keep the runner light)
              run: |
                  python -m pip install --upgrade pip
                  pip install torch --index-url https://download.pytorch.org/whl/cpu
                  pip install -e ".[test,cli,io]"

            - name: Lint and format check
              run: |
                  pip install ruff
                  ruff check .
                  ruff format --check .

            # The default job runs the fast suite. The sampling-heavy statistical
            # tests take minutes and are gated behind the `slow` marker; run them
            # from the "Full suite" job below or with `pytest` locally.
            - name: Run the fast suite
              run: pytest -m "not slow"

    slow:
        # Statistical validation against the quadrature oracles: minutes, not seconds.
        # Not on every push, because it would dominate CI latency for no extra signal
        # on a typical change.
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            # full history: hatch-vcs derives the version from git
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install (CPU-only torch, to keep the runner light)
              run: |
                  python -m pip install --upgrade pip
                  pip install torch --index-url https://download.pytorch.org/whl/cpu
                  pip install -e ".[test,cli,io]"

            - name: Run the full suite
              run: pytest
